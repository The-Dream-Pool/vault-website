*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--plum0);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:14px}
.hide{display:none!important}
.serif{font-family:'Playfair Display',Georgia,serif}
/* aurora */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 70% at 50% -10%,#3A1660 0%,var(--plum) 45%,var(--plum0) 100%)}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.sky i:nth-child(1){width:420px;height:420px;background:#4B1678;top:-120px;left:-140px}
.sky i:nth-child(2){width:360px;height:360px;background:#6A2A9E;top:30%;right:-160px;animation-duration:28s;opacity:.35}
.sky i:nth-child(3){width:300px;height:300px;background:#E3B447;bottom:-180px;left:20%;opacity:.12;animation-duration:32s}
@keyframes drift{to{transform:translate(60px,80px) scale(1.15)}}
.dust{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px var(--gold);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.5}100%{transform:translateY(-105vh);opacity:0}}
/* shared */
.app{position:relative;z-index:1}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 116px)}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;font-weight:600;font-size:15px;width:100%;transition:transform .15s var(--ease),box-shadow .3s}
.btn:active{transform:scale(.97)}
.gold{background:var(--gg);color:#24140A;box-shadow:0 10px 30px -10px rgba(227,180,71,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.ghost{background:rgba(244,238,227,.06);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.card{position:relative;background:linear-gradient(180deg,rgba(54,16,79,.72),rgba(38,17,57,.72));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:22px;box-shadow:inset 0 0 0 1px var(--line2),0 20px 40px -24px rgba(0,0,0,.6)}
.lbl{font-size:13px;color:var(--mute)}
.eb{font-size:13px;font-weight:600;color:var(--gold)}
.h1{font-family:'Playfair Display',Georgia,serif;font-size:36px;line-height:1.05;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font-family:'Playfair Display',Georgia,serif;font-size:24px;line-height:1.15;font-weight:600;margin:0;text-wrap:balance}
.gt{background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.stack{display:flex;flex-direction:column;gap:12px}
.in{opacity:0;transform:translateY(14px);animation:up .7s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
/* logo with shimmer */
.logo{position:relative;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 8px 24px rgba(227,180,71,.35))}
.logo::after{content:"";position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.85) 48%,transparent 62%) 0 0/250% 100%;animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
/* login */
#login{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 28px);max-width:440px;margin:0 auto}
#login .logo{width:84px;height:106px;margin:0 auto 22px}
.brand{text-align:center;font-size:12px;letter-spacing:.24em;color:var(--gold);font-weight:600;margin-bottom:28px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.field label{font-size:13px;color:var(--mute);font-weight:500}
.field input{height:56px;border-radius:16px;background:rgba(22,8,35,.7);border:1px solid rgba(244,238,227,.12);padding:0 18px;font-size:16px;outline:none;transition:border-color .25s,box-shadow .25s}
.field input::placeholder{color:#8B7F9A}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(227,180,71,.14)}
.err{color:#F5B49E;font-size:13px;min-height:20px;margin:-2px 0 12px}
.link{color:var(--gold2);font-weight:500;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.spin{width:20px;height:20px;border-radius:50%;border:2px solid rgba(36,20,10,.3);border-top-color:#24140A;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;height:64px;margin-bottom:6px}
.top .logo{width:34px;height:43px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#24140A;background:var(--gg);box-shadow:0 0 0 3px rgba(227,180,71,.18)}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:999px;background:rgba(227,180,71,.12);color:var(--gold2);font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(227,180,71,.22)}
.live{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(227,180,71,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(227,180,71,0)}100%{box-shadow:0 0 0 0 rgba(227,180,71,0)}}
/* hero dial */
.hero{padding:26px 22px 22px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:280px;height:280px;background:radial-gradient(circle,rgba(227,180,71,.22),transparent 65%);pointer-events:none}
.dialrow{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .arc{stroke-dasharray:var(--c);stroke-dashoffset:var(--c);animation:fill 1.6s .2s var(--ease) forwards;filter:drop-shadow(0 0 6px rgba(227,180,71,.6))}
@keyframes fill{to{stroke-dashoffset:var(--to)}}
.ring .tick{animation:spin 40s linear infinite;transform-origin:66px 66px}
@keyframes spin{to{transform:rotate(360deg)}}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1}
.ring b small{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;color:var(--mute);margin-top:6px}
.segs{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin-top:22px}
.segs i{height:6px;border-radius:3px;background:rgba(244,238,227,.1);overflow:hidden;position:relative}
.segs i::after{content:"";position:absolute;inset:0;background:var(--gg);transform:scaleX(0);transform-origin:left;animation:seg .4s var(--ease) forwards;animation-delay:calc(var(--i)*60ms + .4s)}
.segs i.off::after{display:none}
.segs i.now::after{opacity:.45;animation-name:seg,blink;animation-duration:.4s,1.6s;animation-iteration-count:1,infinite;animation-delay:calc(var(--i)*60ms + .4s),1.6s}
@keyframes seg{to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:.15}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{background:rgba(22,8,35,.45);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line2)}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--mute)}
/* next */
.next{box-shadow:inset 0 0 0 1px rgba(227,180,71,.3),0 0 40px -12px rgba(227,180,71,.35);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 1px rgba(227,180,71,.5),0 0 54px -10px rgba(227,180,71,.5)}}
.bignum{position:absolute;right:18px;top:6px;font-family:'Playfair Display',serif;font-size:96px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(227,180,71,.22);pointer-events:none}
/* upsell: rotating gold border */
.up{padding:2px;border-radius:26px;background:conic-gradient(from var(--a,0deg),rgba(227,180,71,.1),#E3B447,rgba(227,180,71,.1) 30%,rgba(227,180,71,.1) 60%,#F2D98C,rgba(227,180,71,.1));animation:orbit 6s linear infinite}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes orbit{to{--a:360deg}}
.up>div{border-radius:24px;padding:24px;background:radial-gradient(110% 80% at 100% 0%,rgba(227,180,71,.18),transparent 55%),linear-gradient(180deg,#2D1645,#1E0B30)}
.prof{display:flex;align-items:center;gap:14px}
.pav{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:19px;font-weight:600;color:var(--gold2);background:radial-gradient(circle at 30% 25%,#4B1678,#1E0B30);box-shadow:0 0 0 1.5px rgba(227,180,71,.55),0 0 0 6px rgba(227,180,71,.08)}
.rt{flex:1;display:flex;flex-direction:column;gap:2px;text-align:left}
.rt b{font-weight:600;font-size:15px}
.rt span{font-size:13px;color:var(--mute)}
.chev{color:var(--dim);flex:none;transition:transform .2s}
.lock{display:flex;align-items:center;gap:14px;min-height:64px;width:100%}
.lock:active .chev{transform:translateX(3px)}
.li{width:44px;height:44px;border-radius:14px;background:rgba(22,8,35,.55);display:grid;place-items:center;color:var(--dim);flex:none;box-shadow:inset 0 0 0 1px var(--line2)}
.sep{height:1px;background:var(--line2);margin:0 -4px}
/* timeline */
.phase{margin:30px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.phase:first-of-type{margin-top:8px}
.phase h3{margin:0;font-family:'Playfair Display',serif;font-size:21px;font-weight:600}
.phase .pb{width:72px;height:4px;border-radius:2px;background:rgba(244,238,227,.1);overflow:hidden;margin-bottom:8px}
.phase .pb i{display:block;height:100%;background:var(--gg);border-radius:2px;width:0;animation:w 1s .3s var(--ease) forwards}
@keyframes w{to{width:var(--w)}}
.phase small{font-size:12px;color:var(--mute);display:block;text-align:right;margin-bottom:4px}
.tl{position:relative}
.step{position:relative;display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:8px 0 8px 0}
.step .rail{position:absolute;left:21px;top:50%;height:100%;width:2px;background:rgba(244,238,227,.1)}
.step:last-child .rail{display:none}
.step .rail i{position:absolute;inset:0;background:var(--gg);transform:scaleY(0);transform-origin:top;animation:railin .5s var(--ease) forwards;animation-delay:calc(var(--i)*70ms + .2s)}
@keyframes railin{to{transform:scaleY(1)}}
.node{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--dim);background:var(--plum);box-shadow:inset 0 0 0 1.5px rgba(244,238,227,.16)}
.node.done{background:var(--gg);color:#24140A;box-shadow:0 0 18px -4px rgba(227,180,71,.7)}
.node.cur{color:var(--gold2);box-shadow:inset 0 0 0 2px var(--gold)}
.node.cur::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(227,180,71,.5);animation:ripple 2s ease-out infinite}
@keyframes ripple{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.sc{flex:1;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:rgba(38,17,57,.55);box-shadow:inset 0 0 0 1px var(--line2);transition:background .2s,transform .15s var(--ease)}
.step:active .sc{transform:scale(.985)}
.step.cur .sc{background:linear-gradient(90deg,rgba(227,180,71,.14),rgba(38,17,57,.6));box-shadow:inset 0 0 0 1px rgba(227,180,71,.35)}
.step.isdone .rt b{color:var(--body)}
.tag{font-size:11px;font-weight:700;color:#24140A;background:var(--gg);padding:3px 8px;border-radius:999px;flex:none}
/* nav */
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;max-width:420px;margin:0 auto;border-radius:24px;background:rgba(30,11,48,.78);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:inset 0 0 0 1px rgba(244,238,227,.1),0 20px 40px -12px rgba(0,0,0,.7)}
nav .in2{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px}
nav .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:18px;background:rgba(227,180,71,.14);box-shadow:inset 0 0 0 1px rgba(227,180,71,.28);transition:transform .45s var(--ease)}
nav button{position:relative;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);transition:color .3s}
nav button.on{color:var(--gold2)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,3,18,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:linear-gradient(180deg,#2D1645,#1E0B30 60%);border-radius:28px 28px 0 0;padding:10px 22px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(105%);transition:transform .45s var(--ease);max-height:90svh;overflow:auto;box-shadow:inset 0 1px 0 rgba(227,180,71,.25),0 -20px 60px rgba(0,0,0,.5)}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(244,238,227,.25);margin:0 auto}
.shead{position:sticky;top:-10px;z-index:2;margin:-10px -22px 14px;padding:12px 22px 10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#2D1645 70%,rgba(45,22,69,0));touch-action:none;cursor:grab}
.sx{position:absolute;right:14px;top:8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:rgba(244,238,227,.08)}
.sheet{overscroll-behavior:contain}
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,20px);background:var(--ink);color:var(--plum);font-size:14px;font-weight:600;padding:12px 20px;border-radius:999px;opacity:0;transition:.3s var(--ease);z-index:40;white-space:nowrap;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spark{position:fixed;z-index:50;width:7px;height:7px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px var(--gold);pointer-events:none;animation:burst .9s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.next.in{animation:up .7s var(--ease) forwards,glow 3.2s ease-in-out infinite}
.up.in{animation:up .7s var(--ease) forwards,orbit 6s linear infinite}
.vid{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#12061f;box-shadow:inset 0 0 0 1px rgba(227,180,71,.25),0 16px 30px -16px rgba(0,0,0,.7);margin:4px 0 6px}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,rgba(30,11,48,.05),rgba(30,11,48,.55));color:var(--ink);transition:opacity .3s}
.play span{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--gg);color:#24140A;box-shadow:0 0 0 0 rgba(227,180,71,.6);animation:pulse 2.2s infinite;padding-left:3px}
.play em{font-style:normal;font-size:13px;font-weight:600;background:rgba(22,8,35,.7);padding:5px 12px;border-radius:999px}
.vid.on .play{opacity:0;pointer-events:none}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 16px;border-radius:16px;text-align:left;font-size:15px;background:rgba(22,8,35,.5);box-shadow:inset 0 0 0 1px rgba(244,238,227,.1);transition:background .2s,box-shadow .2s,opacity .2s,transform .12s}
.opt:active{transform:scale(.985)}
.ol{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);background:rgba(244,238,227,.06)}
.opt.right{background:rgba(227,180,71,.14);box-shadow:inset 0 0 0 1.5px var(--gold)}
.opt.right .ol{background:var(--gg);color:#24140A}
.opt.wrong{background:rgba(229,138,110,.12);box-shadow:inset 0 0 0 1.5px #E58A6E}
.opt.wrong .ol{background:#E58A6E;color:#24140A}
.opt.faded{opacity:.45}
.opt:disabled{cursor:default}
.why{border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5;color:var(--body);animation:up .4s var(--ease) both}
.why.ok{background:rgba(227,180,71,.1)}.why.no{background:rgba(229,138,110,.1)}
.why b{color:var(--ink)}
.perks{display:flex;flex-direction:column;gap:10px}
.perks div{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink)}
.perks span{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gg);color:#24140A;margin-top:1px}
.proof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.proof div{text-align:center}.proof b{display:block;font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:var(--gold2)}.proof span{font-size:11px;color:var(--mute);line-height:1.3;display:block}
.awrap{max-width:1160px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 20px calc(env(safe-area-inset-bottom) + 48px)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.kpi{padding:18px}.kpi b{display:block;font-family:'Playfair Display',serif;font-size:34px;font-weight:600;line-height:1.1;margin-top:4px}
.kpi.warn b{color:#F0A58C}
.agrid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.amain{flex:999 1 560px}.aside{flex:1 1 300px;display:flex;flex-direction:column;gap:14px}
.ahead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;background:rgba(22,8,35,.6);box-shadow:inset 0 0 0 1px rgba(244,238,227,.1);color:var(--dim);flex:1 1 220px;max-width:320px}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px;color:var(--ink)}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute);background:rgba(244,238,227,.05);box-shadow:inset 0 0 0 1px rgba(244,238,227,.1)}
.fchip.on{color:var(--gold2);background:rgba(227,180,71,.14);box-shadow:inset 0 0 0 1px rgba(227,180,71,.4)}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 110px 92px 18px;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:18px;background:rgba(38,17,57,.6);box-shadow:inset 0 0 0 1px var(--line2);text-align:left;transition:background .2s}
@media(hover:hover){.srow:hover{background:rgba(54,16,79,.7)}}
.srow:active{transform:scale(.99)}
.sav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--gold2);background:radial-gradient(circle at 30% 25%,#4B1678,#1E0B30);box-shadow:0 0 0 1px rgba(227,180,71,.35);flex:none}
.sinfo{display:flex;flex-direction:column;gap:5px}.sinfo b{font-size:15px;font-weight:600}
.youtag{font-style:normal;font-size:10px;font-weight:700;color:#24140A;background:var(--gg);padding:2px 7px;border-radius:999px;margin-left:4px;vertical-align:2px}
.tchs{display:flex;flex-wrap:wrap;gap:5px}.tch{font-size:11px;font-weight:600;color:var(--mute);background:rgba(244,238,227,.06);padding:3px 8px;border-radius:999px}
.sprog{display:flex;align-items:center;gap:8px}.sprog small{font-size:12px;color:var(--mute);width:32px}
.bar{display:block;flex:1;height:6px;border-radius:3px;background:rgba(244,238,227,.1);overflow:hidden}.bar i{display:block;height:100%;background:var(--gg);border-radius:3px}
.slast{display:flex;flex-direction:column;font-size:13px}.slast small{font-size:11px;color:var(--dim)}
.badge{justify-self:start;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.st-ok{color:#24140A;background:var(--gg)}.st-warn{color:#F6D58A;background:rgba(227,180,71,.14);box-shadow:inset 0 0 0 1px rgba(227,180,71,.4)}.st-bad{color:#24140A;background:#F0A58C}.st-done{color:var(--ink);background:rgba(142,78,198,.45)}
.phrow{display:grid;grid-template-columns:118px minmax(0,1fr) 22px;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin-bottom:10px}.phrow b{color:var(--ink);text-align:right}
.pbar{height:10px;border-radius:5px;background:rgba(244,238,227,.08);overflow:hidden}.pbar i{display:block;height:100%;border-radius:5px;background:var(--gg);width:0;animation:w .9s var(--ease) forwards}
.trow{background:rgba(22,8,35,.45);border-radius:16px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line2)}
.compose{background:rgba(22,8,35,.45);border-radius:20px;padding:18px;box-shadow:inset 0 0 0 1px rgba(227,180,71,.2)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:rgba(244,238,227,.06)}
.seg button{min-height:42px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mute)}.seg button.on{background:var(--gg);color:#24140A}
.field textarea{border-radius:16px;background:rgba(22,8,35,.7);border:1px solid rgba(244,238,227,.12);padding:14px 16px;font-size:16px;line-height:1.5;color:var(--ink);outline:none;resize:vertical;font-family:inherit}
.field textarea:focus{border-color:var(--gold)}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.srow{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"a i b" "a p l";row-gap:8px}.srow .sav{grid-area:a;align-self:start}.srow .sinfo{grid-area:i}.srow .badge{grid-area:b;justify-self:end}.srow .sprog{grid-area:p}.srow .slast{grid-area:l;text-align:right;align-items:flex-end}.srow .chev{display:none}}
.grad{background:radial-gradient(120% 90% at 100% 0%,rgba(227,180,71,.22),transparent 55%),linear-gradient(180deg,rgba(54,16,79,.85),rgba(38,17,57,.85))}
.conf{box-shadow:none;animation-name:fall;animation-timing-function:cubic-bezier(.2,.6,.4,1)}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.mstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mstats div{background:rgba(22,8,35,.45);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px var(--line2)}
.mstats b{display:block;font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--gold2);line-height:1.1}
.mstats span{font-size:12px;color:var(--mute)}
.hl{display:flex;flex-direction:column;gap:10px}
.hli{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:linear-gradient(180deg,rgba(54,16,79,.7),rgba(38,17,57,.7))}
.hli::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1.5px;background:linear-gradient(110deg,#A87A1C 0%,#E3B447 30%,#FFF6D6 45%,#E3B447 60%,#A87A1C 100%) 0 0/250% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:bsheen 5s ease-in-out infinite;animation-delay:var(--sd,0s);pointer-events:none}
.hli::after{content:"";position:absolute;inset:0;border-radius:18px;background:linear-gradient(110deg,transparent 35%,rgba(255,240,200,.08) 50%,transparent 65%) 0 0/250% 100%;animation:bsheen 5s ease-in-out infinite;animation-delay:var(--sd,0s);pointer-events:none}
@keyframes bsheen{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
.hli b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}.hli span{font-size:14px;color:var(--mute);line-height:1.45}
.hlic{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;color:var(--gold2);background:rgba(227,180,71,.12);box-shadow:inset 0 0 0 1px rgba(227,180,71,.3)}
.bio{margin:0;color:var(--body);font-size:15px;line-height:1.65}
.more{max-height:0;overflow:hidden;opacity:0;transition:max-height .6s var(--ease),opacity .4s}

.pav.ph{background:url(gaige-pfp.jpg) center/cover;font-size:0}
.mhero{margin:0 -22px;height:280px;position:relative;overflow:hidden}

.mhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,11,48,0) 40%,rgba(42,18,62,.96) 100%)}
@keyframes kb{to{transform:scale(1.18) translate(-2%,-3%)}}
.sk{background:linear-gradient(100deg,rgba(244,238,227,.05) 30%,rgba(227,180,71,.2) 50%,rgba(244,238,227,.05) 70%) 0 0/300% 100%;animation:skel 1.3s linear infinite}

.rk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rk div{background:rgba(22,8,35,.45);border-radius:16px;padding:12px;box-shadow:inset 0 0 0 1px var(--line2)}

.rk .w b{color:#F0A58C}
.rrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;background:rgba(38,17,57,.6);box-shadow:inset 0 0 0 1px var(--line2)}
/* ===== LIGHT MODE (VMM ivory) ===== */
:root[data-mode=light]{color-scheme:light;--plum0:#F4EEE3;--plum:#FBF8F2;--card:#FFFFFF;--ink:#17111F;--body:#3F3848;--mute:#655C6E;--dim:#7D7385;--line:rgba(168,122,28,.28);--line2:rgba(23,17,31,.09);--gold:#A87A1C;--gold2:#8A6514}
[data-mode=light] .sky{background:radial-gradient(120% 70% at 50% -10%,#FFFFFF 0%,#FBF8F2 45%,#F4EEE3 100%)}
[data-mode=light] .sky i{opacity:.14}[data-mode=light] .sky i:nth-child(3){opacity:.18}
[data-mode=light] .dust{background:#C99A3A;box-shadow:none;opacity:.5}
[data-mode=light] .card{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(251,248,242,.92));box-shadow:inset 0 0 0 1px rgba(23,17,31,.07),0 18px 36px -24px rgba(75,22,120,.28)}
[data-mode=light] .gt{background:linear-gradient(135deg,#C8952E,#8A6514);-webkit-background-clip:text;background-clip:text}
[data-mode=light] .ghost{background:rgba(23,17,31,.05);box-shadow:inset 0 0 0 1px rgba(23,17,31,.1)}
[data-mode=light] .field input,[data-mode=light] .field textarea,[data-mode=light] .search{background:#FFFFFF;border-color:rgba(23,17,31,.14);box-shadow:none}
[data-mode=light] .field input::placeholder{color:#8F8698}

{const sh=$('#sheet');let sy=null,dy=0;
sh.addEventListener('touchstart',e=>{const onHead=!!e.target.closest('.shead');if(e.target.closest('textarea,input'))return;if(!onHead&&sh.scrollTop>0)return;sy=e.touches[0].clientY;dy=0},{passive:true});
sh.addEventListener('touchmove',e=>{if(sy==null)return;dy=e.touches[0].clientY-sy;if(dy<=0){if(sh.style.transform){sh.style.transform='';sh.style.transition=''}if(!e.target.closest('.shead'))sy=null;return}sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()},{passive:false});
const end=()=>{if(sy==null)return;sh.style.transition='';sh.style.transform='';if(dy>90)closeSheet();sy=null;dy=0};
sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',end);}

/* ===== ADMIN ===== */
let AD={filter:'all',q:'',sel:null,ch:'text',tr:null,tpl:null},ROWS=[],REP=null,REPTXT='';
const dayMs=864e5;
async function loadAdmin(){
  const [s,p]=await Promise.all([sb.from('students').select('*').order('created_at',{ascending:false}),sb.from('progress').select('user_id,track,step')]);
  if(s.error){toast('Couldn’t load students');ROWS=[];return}
  const cnt={};(p.data||[]).forEach(r=>{const k=r.user_id+'|'+r.track;(cnt[k]=cnt[k]||new Set()).add(r.step)});
  const now=Date.now();
  ROWS=(s.data||[]).map(r=>{const tracks={},sk=cnt[r.id+'|skool']||new Set();(r.tracks||[]).forEach(t=>{if(TRACKS[t]){const set=new Set([...sk]);(cnt[r.id+'|'+t]||new Set()).forEach(i=>set.add(i+OBN));tracks[t]=set}});
    return {id:r.id,name:r.full_name||r.email.split('@')[0],email:r.email,phone:r.phone||'',tracks,
      days:Math.max(0,Math.floor((now-new Date(r.last_active||r.created_at))/dayMs)),joined:Math.max(0,Math.floor((now-new Date(r.created_at))/dayMs))}});
}
const ago=d=>d<=0?'Today':d===1?'Yesterday':d+' days ago';
const tN=tk=>TRACKS[tk].steps.length;
const nextIx=(p,tk)=>{const s=p.tracks[tk];for(let i=0;i<tN(tk);i++)if(!s.has(i))return i;return -1};
const hasTracks=p=>Object.keys(p.tracks).length>0;
const allDone=p=>hasTracks(p)&&Object.keys(p.tracks).every(t=>p.tracks[t].size>=tN(t));
const status=p=>!hasTracks(p)?['No tracks yet','st-warn']:allDone(p)?['Completed','st-done']:p.days>=10?['Stuck','st-bad']:p.days>=4?['Slipping','st-warn']:['On track','st-ok'];
const prog=p=>{const k=Object.keys(p.tracks);if(!k.length)return 0;return Math.round(k.reduce((a,t)=>a+p.tracks[t].size/tN(t),0)/k.length*100)};
function filtered(){let L=ROWS.slice();
  if(AD.filter==='attn')L=L.filter(p=>p.days>=4&&!allDone(p));else if(AD.filter!=='all')L=L.filter(p=>p.tracks[AD.filter]);
  if(AD.q){const q=AD.q.toLowerCase();L=L.filter(p=>(p.name+' '+p.email).toLowerCase().includes(q))}
  return L.sort((a,b)=>b.days-a.days)}
function adminView(){
  const all=ROWS,act=all.filter(p=>p.days<=7).length,attn=all.filter(p=>p.days>=10&&!allDone(p)).length;
  const avg=all.length?Math.round(all.reduce((a,p)=>a+prog(p),0)/all.length):0;
  const chips=[['all','All'],['attn','Needs attention'],...ORDER.map(k=>[k,TRACKS[k].short])].map(([k,l])=>`<button class="fchip${AD.filter===k?' on':''}" data-filter="${k}">${l}</button>`).join('');
  const rows=filtered().map((p,k)=>{const [sl,sc]=status(p),pr=prog(p);
    const tch=Object.keys(p.tracks).map(t=>{const n=nextIx(p,t);return `<span class="tch">${TRACKS[t].short} · ${n<0?'done':'step '+(n+1)}</span>`}).join('');
    return `<button class="srow in" style="animation-delay:${Math.min(k*.03,.4)}s" data-stu="${p.id}"><span class="sav">${ini(p.name)}</span><span class="sinfo"><b>${esc(p.name)}</b><span class="tchs">${tch||'<span class="tch">No tracks picked</span>'}</span></span><span class="sprog"><span class="bar"><i style="width:${pr}%"></i></span><small>${pr}%</small></span><span class="slast"><small>Last active</small>${ago(p.days)}</span><span class="badge ${sc}">${sl}</span>${chev}</button>`}).join('')
    ||`<p class="lbl" style="padding:20px;text-align:center">${all.length?'No students match.':'No students yet. They’ll show up here as soon as they sign in.'}</p>`;
  const tcards=ORDER.map(k=>{const t=TRACKS[k],L=all.filter(p=>p.tracks[k]);const a=L.length?Math.round(L.reduce((s,p)=>s+p.tracks[k].size,0)/L.length):0;
    return `<div class="card"><div class="prof">${pav(t)}<span class="rt"><b style="font-size:16px">${t.name}</b><span>${t.prof}</span></span></div><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b>${L.length}</b><span>Students</span></div><div class="stat"><b>${a}<span style="font-size:14px;color:var(--mute)">/${t.steps.length}</span></b><span>Avg steps done</span></div></div></div>`}).join('');
  return `<div class="awrap">
  <div class="top"><div style="display:flex;align-items:center;gap:12px"><div class="logo" style="width:34px;height:43px" role="img" aria-label="Vault"></div><span class="chip">Admin</span></div><div style="display:flex;gap:8px">
   <button class="btn ghost abtn" id="arep" aria-label="Weekly report"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Weekly report</span></button>
   <button class="btn ghost abtn" id="astu" aria-label="My student view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Student view</span></button>
   <button class="btn ghost" data-mode="${P.mode==='light'?'dark':'light'}" aria-label="Toggle light or dark mode" style="width:44px;min-height:44px;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
   <button class="btn ghost abtn" id="aout" aria-label="Sign out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></button></div></div>
  <div class="in" style="margin:6px 0 20px"><h1 class="h1">Student <em class="gt">success</em></h1><p class="lbl" style="margin:8px 0 0;font-size:15px">${attn?`${attn} student${attn>1?'s':''} haven’t been active in 10+ days.`:all.length?'Everyone is moving.':'Waiting for your first students.'}</p></div>
  <div class="kpis in" style="animation-delay:.05s">
    <div class="card kpi"><span class="lbl">Students</span><b data-count="${all.length}">0</b></div>
    <div class="card kpi"><span class="lbl">Active this week</span><b data-count="${act}">0</b></div>
    <div class="card kpi warn"><span class="lbl">Stuck 10+ days</span><b data-count="${attn}">0</b></div>
    <div class="card kpi"><span class="lbl">Avg progress</span><b data-count="${avg}" data-suf="%">0%</b></div>
  </div>
  <div class="agrid">
   <div class="amain">
    <div class="ahead"><h2 class="h2">Students</h2><div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="aq" type="search" placeholder="Search name or email" value="${esc(AD.q)}" aria-label="Search students"></div></div>
    <div class="fchips">${chips}</div>
    <div class="slist" id="slist">${rows}</div>
   </div>
   <div class="aside"><h2 class="h2" style="font-size:20px;margin:0">Tracks</h2>${tcards}</div>
  </div></div>`}
const TPL={
 checkin:['Check in',c=>`Hey ${c.first}, it's ${c.pf} from the Vault. I noticed you haven't been active in the portal for ${c.daysTxt} and you've been on step ${c.n}${c.step?` (${c.step})`:''}. Any questions I can help with?`,'Checking in on your progress'],
 stuck:['Stuck on step',c=>`Hey ${c.first}! Looks like step ${c.n}${c.step?`, ${c.step},`:''} is giving you some trouble. Want me to walk you through it? Reply here and let's get you unstuck today.`,'Need a hand with step {n}?'],
 congrats:['Congrats',c=>c.pct>=100?`${c.first}, you finished the entire ${c.track} track. That's huge. Ready for your next level? I've got a few 1-on-1 spots for graduates.${c.link?` Grab yours here: ${c.link}`:''}`:`${c.first}, you're ${c.pct}% through the ${c.track} track. That's real progress. Keep stacking steps and let me know if you need anything.`,'You’re crushing it'],
 offer:['1-on-1 offer',c=>`${c.first}, you've been putting in work. If you want to move faster, I've got a few 1-on-1 spots open where we build your plan together.${c.link?` Apply here: ${c.link}`:''}`,'A few 1-on-1 spots just opened']};
function ctx(p){const keys=Object.keys(p.tracks),tk=AD.tr&&p.tracks[AD.tr]?AD.tr:keys[0];if(!tk)return {first:p.name.split(' ')[0],pf:'the team',track:'Vault',link:'',n:1,step:'',pct:0,daysTxt:p.days+' days',tk:null};
  const t=TRACKS[tk],n=nextIx(p,tk);return {first:p.name.split(' ')[0],pf:t.pf,track:t.name,link:t.link,n:n<0?tN(tk):n+1,step:n<0?'':t.steps[n][0],pct:Math.round(p.tracks[tk].size/tN(tk)*100),daysTxt:p.days<=1?'a day':p.days+' days',tk}}
function stuSheet(id,keep){
  const p=ROWS.find(x=>x.id===id);if(!p)return;
  if(!keep){AD.sel=id;AD.tr=Object.keys(p.tracks)[0]||null;AD.tpl=allDone(p)?'congrats':p.days>=10?'checkin':p.days>=4?'stuck':'congrats';AD.ch=p.phone?'text':'email'}
  const c=ctx(p),[sl,sc]=status(p),T2=TPL[AD.tpl],msg=T2[1](c),subj=T2[2].replace('{n}',c.n);
  const tracks=Object.keys(p.tracks).map(tk=>{const d=p.tracks[tk].size,N=tN(tk),n=nextIx(p,tk);return `<div class="trow"><div style="display:flex;justify-content:space-between;gap:10px"><b>${TRACKS[tk].name}</b><span class="lbl">${d}/${N}</span></div><div class="lbl" style="margin:2px 0 8px">${n<0?'Track complete':'On step '+(n+1)+': '+esc(TRACKS[tk].steps[n][0])} · ${TRACKS[tk].prof}</div><span class="bar"><i style="width:${d/N*100}%"></i></span></div>`}).join('');
  const trChips=Object.keys(p.tracks).length>1?`<div class="lbl">Send as</div><div class="fchips" style="margin:0">${Object.keys(p.tracks).map(tk=>`<button class="fchip${c.tk===tk?' on':''}" data-atr="${tk}">${TRACKS[tk].pf} · ${TRACKS[tk].short}</button>`).join('')}</div>`:'';
  openSheet(`<div class="stack" style="gap:16px">
    <div class="prof" style="align-items:flex-start;padding-right:44px"><span class="sav" style="width:52px;height:52px;font-size:17px">${ini(p.name)}</span><div style="flex:1;min-width:0"><div class="serif" style="font-size:24px;font-weight:600;line-height:1.1">${esc(p.name)}</div><div class="lbl" style="overflow-wrap:anywhere;margin-top:4px">${esc(p.email)}</div>${p.phone?`<div class="lbl">${esc(p.phone)}</div>`:''}<span class="badge ${sc}" style="display:inline-block;margin-top:8px">${sl}</span></div></div>
    <div class="stats" style="margin:0"><div class="stat"><b style="font-size:17px">${p.days<=0?'Today':p.days+'d ago'}</b><span>Last active</span></div><div class="stat"><b style="font-size:17px">${p.joined} days</b><span>Member</span></div><div class="stat"><b style="font-size:17px">${prog(p)}%</b><span>Progress</span></div></div>
    <div class="stack" style="gap:10px">${tracks||'<p class="lbl" style="margin:0">This student hasn’t picked a track yet.</p>'}</div>
    <div class="compose stack" style="gap:12px">
      <h3 class="h2" style="font-size:20px">Reach out</h3>
      <div class="seg"><button class="${AD.ch==='text'?'on':''}" data-ach="text">Text</button><button class="${AD.ch==='email'?'on':''}" data-ach="email">Email</button></div>
      ${trChips}
      <div class="lbl">Template</div>
      <div class="fchips" style="margin:0">${Object.entries(TPL).map(([k,v])=>`<button class="fchip${AD.tpl===k?' on':''}" data-atpl="${k}">${v[0]}</button>`).join('')}</div>
      ${AD.ch==='email'?`<div class="field" style="margin:0"><label for="asubj">Subject</label><input id="asubj" value="${esc(subj)}"></div>`:''}
      <div class="field" style="margin:0"><label for="amsg">${AD.ch==='email'?'Email to '+esc(p.email):p.phone?'Text to '+esc(p.phone):'No phone number on file'}</label><textarea id="amsg" rows="6">${esc(msg)}</textarea></div>
      <button class="btn gold" data-asend ${AD.ch==='text'&&!p.phone?'disabled style="opacity:.5"':''}>${AD.ch==='email'?'Open in email':'Open in messages'}</button>
      <button class="btn ghost" data-acopy>Copy message</button>
    </div></div>`)}
function reportSheet(){
  const all=ROWS,now=new Date(),st=new Date(now-6*dayMs),f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const nw=all.filter(p=>p.joined<=7).length,act=all.filter(p=>p.days<=7).length,stuck=all.filter(p=>p.days>=10&&!allDone(p)),fin=all.filter(allDone).length;
  const avg=all.length?Math.round(all.reduce((a,p)=>a+prog(p),0)/all.length):0;
  const movers=all.filter(p=>p.days<=3&&!allDone(p)&&hasTracks(p)).sort((a,b)=>prog(b)-prog(a)).slice(0,3);
  const nudge=stuck.sort((a,b)=>b.days-a.days).map(p=>{const tk=Object.keys(p.tracks)[0],n=tk?nextIx(p,tk):0;return `<button class="rrow" data-stu="${p.id}"><span class="sav" style="width:36px;height:36px;font-size:12px">${ini(p.name)}</span><span class="rt"><b>${esc(p.name)}</b><span>${p.days} days inactive${tk?' · '+TRACKS[tk].pf+' · step '+(n<0?tN(tk):n+1):''}</span></span>${chev}</button>`}).join('');
  const bt=ORDER.map(k=>{const L=all.filter(p=>p.tracks[k]);return `<div class="phrow"><span>${TRACKS[k].short}</span><span class="pbar"><i style="--w:${all.length?L.length/all.length*100:0}%"></i></span><b>${L.length}</b></div>`}).join('');
  REPTXT=`Vault weekly report (${f(st)} – ${f(now)})\nNew students: ${nw}\nActive this week: ${act}/${all.length}\nStuck 10+ days: ${stuck.length}${stuck.length?' ('+stuck.map(p=>p.name.split(' ')[0]).join(', ')+')':''}\nFinished a track: ${fin}\nAvg progress: ${avg}%`;
  openSheet(`<div class="stack" style="gap:16px">
   <div><span class="eb">${f(st)} – ${f(now)}</span><h2 class="h1" style="font-size:32px;margin-top:4px">Weekly <em class="gt">report</em></h2></div>
   <div class="rk"><div><b data-count="${nw}">0</b><span>New students</span></div><div><b data-count="${act}">0</b><span>Active this week</span></div><div class="w"><b data-count="${stuck.length}">0</b><span>Stuck 10+ days</span></div><div><b data-count="${fin}">0</b><span>Finished a track</span></div><div><b data-count="${avg}" data-suf="%">0%</b><span>Avg progress</span></div><div><b data-count="${all.length}">0</b><span>Total students</span></div></div>
   ${stuck.length?`<div class="stack" style="gap:8px"><h3 class="h2" style="font-size:20px">Needs a nudge</h3>${nudge}</div>`:''}
   ${movers.length?`<div class="stack" style="gap:8px"><h3 class="h2" style="font-size:20px">Top movers</h3>${movers.map(p=>`<div class="rrow"><span class="sav" style="width:36px;height:36px;font-size:12px">${ini(p.name)}</span><span class="rt"><b>${esc(p.name)}</b><span>${prog(p)}% complete · active ${ago(p.days).toLowerCase()}</span></span></div>`).join('')}</div>`:''}
   <div class="card" style="padding:18px"><h3 class="h2" style="font-size:20px;margin-bottom:14px">Students by track</h3>${bt}</div>
   <div class="compose stack" style="gap:12px"><h3 class="h2" style="font-size:20px">Share it</h3><a class="btn gold" href="mailto:?subject=${encodeURIComponent('Vault weekly report')}&body=${encodeURIComponent(REPTXT)}">Email this report</a><button class="btn ghost" id="rcopy">Copy report</button></div>
  </div>`);countUp()}
async function renderAdmin(sk){
  if(sk&&!reduce){const b=(h,w,r)=>`<div class="sk" style="height:${h}px;width:${w||'100%'};border-radius:${r||18}px"></div>`;
    $('#admin').innerHTML=`<div class="awrap"><div class="top">${b(40,'120px',12)}${b(40,'90px',12)}</div><div class="stack" style="gap:14px">${b(44,'50%',10)}<div class="kpis">${b(96)}${b(96)}${b(96)}${b(96)}</div>${b(46,'40%',12)}${b(74)}${b(74)}${b(74)}</div></div>`}
  if(sk)await loadAdmin();
  $('#admin').innerHTML=adminView();countUp()}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-filter],[data-stu],[data-atpl],[data-ach],[data-atr],[data-asend],[data-acopy],#arep,#rcopy,#aout,#astu');
  if(!t||t.disabled)return;
  if(t.id==='arep'){reportSheet();return}
  if(t.id==='rcopy'){navigator.clipboard&&navigator.clipboard.writeText(REPTXT).then(()=>toast('Report copied'),()=>toast('Copy not allowed here'));return}
  if(t.id==='aout'){VIEW='student';loginMode='student';await sb.auth.signOut();return}
  if(t.id==='astu'){VIEW='student';if(!ME.tracks||!ME.tracks.length){show('login');loginView('pick')}else enter();return}
  if(t.dataset.filter){AD.filter=t.dataset.filter;renderAdmin();return}
  if(t.dataset.stu){stuSheet(t.dataset.stu);return}
  if(t.dataset.atpl){AD.tpl=t.dataset.atpl;stuSheet(AD.sel,true);return}
  if(t.dataset.ach){AD.ch=t.dataset.ach;stuSheet(AD.sel,true);return}
  if(t.dataset.atr){AD.tr=t.dataset.atr;stuSheet(AD.sel,true);return}
  if(t.dataset.asend!==undefined){const p=ROWS.find(x=>x.id===AD.sel),m=$('#amsg').value;
    if(AD.ch==='email'){const s=$('#asubj')?$('#asubj').value:'';location.href=`mailto:${encodeURIComponent(p.email)}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(m)}`}
    else{const ph=p.phone.replace(/[^\d+]/g,'');location.href=`sms:${ph}${/iPhone|iPad|Mac/.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(m)}`}return}
  if(t.dataset.acopy!==undefined){navigator.clipboard&&navigator.clipboard.writeText($('#amsg').value).then(()=>toast('Message copied'),()=>toast('Copy not allowed here'));return}
});
document.addEventListener('input',e=>{if(e.target.id==='aq'){AD.q=e.target.value;const pos=e.target.selectionStart;renderAdmin();const n=$('#aq');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});

const _show=show;show=function(w){const b=document.getElementById("boot");if(b)b.remove();_show(w)};
</script>
